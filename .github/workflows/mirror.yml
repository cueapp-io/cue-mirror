name: mirror
on:
  workflow_dispatch:
  schedule: [{ cron: "*/20 * * * *" }]
concurrency: { group: mirror, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-audit --no-fund playwright@1.49.0 && npx playwright install --with-deps chromium
      - run: node probe.js
      - name: commit
        run: |
          git config user.name "cue mirror"
          git config user.email "mirror@cueapp.io"
          git add -A mirror
          git diff --cached --quiet || git commit -m "mirror $(date -u +%FT%TZ)"
          git push
